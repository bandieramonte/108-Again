name: App Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  app-tests:
    name: App behavior tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run app tests
        run: npm run test:ci
